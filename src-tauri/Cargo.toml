[package]
name = "agent-run-recorder"
version = "0.1.0"
description = "Privacy-first local AI Agent run recorder"
authors = ["Agent Run Recorder"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "agent_run_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
aes-gcm = { version = "0.11.0", features = ["zeroize"] }
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
dirs = "6.0.0"
hex = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
keyring = "4.1.5"
prost = "0.14.1"
rand = "0.9.2"
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = ["tray-icon"] }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml_edit = "0.25.13"
uuid = { version = "1.20.0", features = ["serde", "v4", "v5"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
tempfile = "3.24.0"
